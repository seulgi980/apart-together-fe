# main(또는 master) 브랜치에 push하면: 타입 검사·린트 -> 도커 이미지 빌드 -> EC2에 배포
# (이 파일이 GitHub Actions 설정이다. 지우면 push해도 자동 배포가 돌지 않는다.)
#
# 저장소 Settings > Secrets and variables > Actions 에 넣어 둘 값:
#   Secrets
#     EC2_HOST                          EC2 주소 (도메인 또는 IP)
#     EC2_USER                          접속 계정 (우분투면 ubuntu)
#     EC2_SSH_KEY                       배포용 SSH 개인 키 전체 내용
#     NEXT_PUBLIC_GOOGLE_MAPS_API_KEY   지도용 구글 키
#   Variables
#     NEXT_PUBLIC_API_URL               https://내도메인
#
# NEXT_PUBLIC_ 값은 빌드할 때 코드에 들어간다. 그래서 EC2의 .env 가 아니라 여기서 넣는다.

name: deploy-frontend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 돌린다
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 타입 검사
        # LayoutProps 같은 타입은 Next.js가 만들어 주는 파일에 있다. 먼저 만든 뒤 검사한다.
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: 린트
        run: npm run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 정하기 (소문자)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apart-together-fe" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드해서 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: 새 이미지로 다시 띄우기
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 이미지 받기용 토큰은 이 작업이 끝나면 만료된다. 표준 입력으로만 넘기고 EC2에 남기지 않는다.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "
            set -e
            cd ~/apart-together
            test -f docker-compose.yml || { echo 'docker-compose.yml 이 없습니다. 백엔드 저장소를 먼저 push해 주세요.'; exit 1; }
            test -f .env || { echo '~/apart-together/.env 가 없습니다. 백엔드 저장소의 deploy/README.md 5-3 을 보고 만들어 주세요.'; exit 1; }
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            docker compose pull frontend
            docker compose up -d frontend
            docker logout ghcr.io
            docker image prune -f
          "

      - name: 화면이 떴는지 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000/login > /dev/null; then echo "프론트 정상"; exit 0; fi
              sleep 3
            done
            echo "프론트가 뜨지 않았습니다. 마지막 로그:"
            cd ~/apart-together && docker compose logs --tail 80 frontend
            exit 1
          '
